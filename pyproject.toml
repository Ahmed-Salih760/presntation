[project]
name = "zydisk-player"
version = "1.0.0"
description = "Motion graphic presentation player"
requires-python = ">=3.10"

dependencies = [
    "flet==0.86.2",
    "flet-video==0.1.0"
]


[tool.flet]

org = "com.zydisk"
product = "Zydisk Player"
company = "Zydisk"

[tool.flet.android]

permissions = [
    "android.permission.READ_EXTERNAL_STORAGE",
    "android.permission.WRITE_EXTERNAL_STORAGE"
]